name: Refresh Medium feed

on:
  schedule:
    - cron: "17 11 * * *"   # daily, ~11:17 UTC
  workflow_dispatch:         # allow manual runs

permissions:
  contents: write

concurrency:
  group: refresh-medium
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild medium.json
        run: python3 scripts/build_medium.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- medium.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add medium.json
            git commit -m "Refresh Medium feed [skip ci]"
            git push
          else
            echo "medium.json already up to date."
          fi
